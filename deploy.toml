# Test-then-deploy gate, read by the hub's deployer. It runs the command from
# the repo root in a scratch checkout on steef-server before a deploy.
# `--extra dev` pulls in pytest (an optional extra here, not a dependency
# group); `--frozen` still applies since it's already resolved in uv.lock.
# The embedder is mocked throughout, so this needs no ONNX model download and
# no GPU. 372 tests, ~75s on this box.

# timeout_s 600: a client box runs this gate on slower hardware, several
# gates at once; Friday's runs took up to 2-3x steef-server's (2026-10-11).
[test]
command = "uv run --extra dev --frozen python -m pytest -q -p no:cacheprovider -rs tests"
timeout_s = 600
enforce = true     # a failing test holds the deploy
